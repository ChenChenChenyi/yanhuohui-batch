server.port=7491

# -----------------------------------------
# spring国际化的使用，用来通过错误码映射得到错误说明
# -----------------------------------------
spring.messages.basename = i18n/ResultCode


# -----------------------------------------
# dataSource1
# -----------------------------------------
spring.datasource.primary.url=jdbc:mysql://127.0.0.1:3306/yanhuohui-batch?useSSL=false&autoReconnect=true&characterEncoding=utf8&serverTimezone=GMT%2B8
spring.datasource.primary.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.primary.username=root
spring.datasource.primary.password=123456
spring.datasource.primary.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.primary.hikari.pool-name=HikariCP-Primary
spring.datasource.primary.hikari.minimum-idle=5
spring.datasource.primary.hikari.idle-timeout=600000
spring.datasource.primary.hikari.maximum-pool-size=10
spring.datasource.primary.hikari.max-lifetime=1800000
spring.datasource.primary.hikari.connection-timeout=30000
spring.datasource.primary.hikari.connection-test-query=SELECT 1
# -----------------------------------------
# dataSource2
# -----------------------------------------
spring.datasource.wangdai.url=jdbc:mysql://127.0.0.1:3306/yanhuohui-batch-wangdai?useSSL=false&autoReconnect=true&characterEncoding=utf8&serverTimezone=GMT%2B8
spring.datasource.wangdai.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.wangdai.username=root
spring.datasource.wangdai.password=123456
